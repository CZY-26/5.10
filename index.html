<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息登记网页 - 陈政宇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f4f4f4;
            padding: 30px;
        }

        .resume-container {
            width: 1050px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #ddd;
            padding: 30px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        legend {
            font-size: 22px;
            font-weight: bold;
            color: #222;
            text-align: center;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            line-height: 1.6;
        }

        table td {
            border: 1px solid #ccc;
            padding: 12px 15px;
            vertical-align: middle;
        }

        .label-col {
            background-color: #f2f2f2;
            font-weight: bold;
            color: #333;
            width: 12%;
            text-align: center;
        }

        .photo-cell {
            text-align: center;
            width: 140px;
        }

        .photo-box {
            width: 120px;
            height: 160px;
            border: 1px solid #ccc;
            display: inline-block;
            background-color: #fff;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        input[type="text"],
        select,
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 8px 10px;
            border: none;
            border-radius: 0;
            font-size: 14px;
            outline: none;
            background: transparent;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .checkbox-full-row {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
        }

        .submit-row {
            text-align: center;
            padding: 20px 0;
        }

        input[type="submit"] {
            padding: 10px 30px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="resume-container">
        <h1>个人信息登记表</h1>
        <form action="#" method="post" enctype="multipart/form-data">

            <fieldset>
                <legend>一、基本信息</legend>
                <table>
                    <tr>
                        <td class="label-col">姓名</td>
                        <td><input type="text" name="username" value="陈政宇"></td>
                        <td class="label-col">性别</td>
                        <td class="radio-group">
                            <label><input type="radio" name="gender" value="男" checked> 男</label>
                            <label><input type="radio" name="gender" value="女"> 女</label>
                        </td>
                        <td class="label-col">年龄</td>
                        <td>
                            <select name="age">
                                <option value="20">20</option>
                                <option value="21">21</option>
                                <option value="22" selected>22</option>
                                <option value="23">23</option>
                                <option value="24">24</option>
                            </select>
                        </td>
                        <td rowspan="4" class="photo-cell">
                            <div class="photo-box">
                                <img src="图片1.jpg" alt="证件照">
                            </div>
                            <input type="file" name="photo" accept="image/*">
                        </td>
                    </tr>
                    <tr>
                        <td class="label-col">📍籍贯</td>
                        <td>
                            <select name="address">
                                <option value="山东省菏泽市" selected>山东省菏泽市</option>
                                <option value="山东省济南市">山东省济南市</option>
                                <option value="山东省青岛市">山东省青岛市</option>
                                <option value="其他">其他</option>
                            </select>
                        </td>
                        <td class="label-col">📞联系电话</td>
                        <td><input type="text" name="phone" value="198****3515"></td>
                        <td class="label-col">📧电子邮箱</td>
                        <td><input type="text" name="email" value="21*****394@qq.com"></td>
                    </tr>
                    <tr>
                        <td class="label-col">🎓学历</td>
                        <td>
                            <select name="education">
                                <option value="专科">专科</option>
                                <option value="本科" selected>本科</option>
                                <option value="硕士">硕士</option>
                                <option value="博士">博士</option>
                            </select>
                        </td>
                        <td class="label-col">🏥健康状况</td>
                        <td>
                            <select name="health">
                                <option value="优秀">优秀</option>
                                <option value="良好" selected>良好</option>
                                <option value="一般">一般</option>
                            </select>
                        </td>
                        <td class="label-col">💍婚姻状况</td>
                        <td>
                            <select name="marry">
                                <option value="未婚" selected>未婚</option>
                                <option value="已婚">已婚</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td class="label-col">💼求职意向</td>
                        <td>
                            <select name="job">
                                <option value="人民警察" selected>人民警察</option>
                                <option value="程序员">程序员</option>
                                <option value="公务员">公务员</option>
                                <option value="其他">其他</option>
                            </select>
                        </td>
                        <td class="label-col">💻专业</td>
                        <td><input type="text" name="major" value="计算机科学与技术"></td>
                        <td class="label-col">🏫毕业院校</td>
                        <td><input type="text" name="school" value="烟台理工学院"></td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>二、专业能力</legend>
                <table>
                    <tr>
                        <td class="label-col">技能证书</td>
                        <td colspan="6">
                            <div class="checkbox-full-row">
                                <label><input type="checkbox" name="cert" value="计算机二级"> 计算机二级</label>
                                <label><input type="checkbox" name="cert" value="英语四级"> 英语四级</label>
                                <label><input type="checkbox" name="cert" value="驾驶证"> 驾驶证</label>
                                <label><input type="checkbox" name="cert" value="其他"> 其他</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="label-col">个人特长与爱好</td>
                        <td colspan="6">
                            <select name="hobby">
                                <option value="打篮球" selected>打篮球</option>
                                <option value="跑步">跑步</option>
                                <option value="看书">看书</option>
                                <option value="游泳">游泳</option>
                                <option value="其他">其他</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td class="label-col">项目经历</td>
                        <td colspan="6">
                            <textarea name="project">无</textarea>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>三、综合说明</legend>
                <table>
                    <tr>
                        <td class="label-col">自我评价</td>
                        <td colspan="6">
                            <textarea name="selfintro">为人正直，责任心强，纪律意识良好，热爱公安事业，具备计算机专业技能，服从组织安排。</textarea>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <div class="submit-row">
                <input type="submit" value="提交">
            </div>
        </form>
    </div>
</body>
</html>
